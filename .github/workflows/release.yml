name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.jks
          printf 'storeFile=app/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/keystore.properties

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifmirror-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  macos:
    name: Build macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: mac
        run: xcodegen generate

      - name: Build Release
        working-directory: mac
        run: |
          xcodebuild -project NotifMirror.xcodeproj \
            -scheme NotifMirror \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            build

      - name: Package app bundle
        working-directory: mac
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DerivedData/Build/Products/Release/NotifMirror.app \
            build/NotifMirror-macOS.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: notifmirror-macos
          path: mac/build/NotifMirror-macOS.zip
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [android, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extract changelog for this tag
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ /^## \[/ {
              if (in_block) exit
              if (index($0, "[" ver "]")) in_block=1
              next
            }
            in_block { print }
          ' CHANGELOG.md > /tmp/release-body.md
          echo "body-file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.body-file }}
          files: |
            dist/**/*.apk
            dist/**/*.zip
          draft: true
