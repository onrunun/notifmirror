name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Android (build · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest

      - name: Detekt
        working-directory: android
        run: ./gradlew detekt

      - name: Android Lint
        working-directory: android
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: notifmirror-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    name: macOS (build · test · lint)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        working-directory: mac
        run: xcodegen generate

      - name: SwiftLint
        working-directory: mac
        run: swiftlint lint --config .swiftlint.yml

      - name: Build
        working-directory: mac
        run: |
          xcodebuild -project NotifMirror.xcodeproj \
            -scheme NotifMirror \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            build

      - name: Test
        working-directory: mac
        run: |
          xcodebuild -project NotifMirror.xcodeproj \
            -scheme NotifMirror \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: macos-xctest-results
          path: mac/build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
